name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Копируем веб-файлы в assets приложения
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest *.png android/app/src/main/assets/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Сборка release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk budget.apk

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: budget-apk
          path: budget.apk

      - name: Переставить тег latest на текущий коммит
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - name: Выложить в Releases (тег latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Бюджет — сборка ${{ github.run_number }}
          body: |
            Установка: скачайте budget.apk на телефон и откройте. Новая сборка ставится поверх старой, данные сохраняются.
          files: budget.apk
          prerelease: false
          make_latest: true
